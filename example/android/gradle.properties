org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# ── Local native testing ─────────────────────────────────────────────────────
# Build this example against the Audienzz Android SDK checkout instead of the published artifact.
# The plugin calls native APIs that are NOT in any published release, so this is required to run it.
#
#   cd ~/Documents/audienzz-android-sdk
#   sed -i '' 's/audienzzSdkVersion = "0.2.2"/audienzzSdkVersion = "0.2.3-local"/' Audienzz/build.gradle.kts
#   ./gradlew :Audienzz:publishToMavenLocal
#
# Delete this line to go back to the published pin. See LOCAL_TESTING.md.
audienzzNativeVersion=0.2.3-local
