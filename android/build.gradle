group = "com.audienzz.audienzz_sdk_flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.0.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// Local-native testing hook. The DEFAULT is the published pin below; setting
// `audienzzNativeVersion` (see example/android/gradle.properties) swaps in a build you published
// with `./gradlew :Audienzz:publishToMavenLocal` in the android-sdk checkout.
//
// Deliberately a property rather than an edit: this file ships inside the pub package, and a
// hardcoded `-local` version in it would follow every publisher who installs the SDK.
def audienzzNativeVersion = project.findProperty("audienzzNativeVersion") ?: "0.3.0"

allprojects {
    repositories {
        // Consulted first so a locally published build wins when one is asked for. Harmless
        // otherwise: nothing resolves from it unless the requested version is only there.
        mavenLocal()
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.audienzz.audienzz_sdk_flutter"
    }

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    dependencies {
        implementation 'com.google.android.gms:play-services-ads:25.1.0'
        implementation "com.audienzz:sdk:$audienzzNativeVersion"
        implementation 'androidx.multidex:multidex:2.0.1'
        implementation 'androidx.core:core-ktx:1.15.0'

        // Unit tests for the plugin's OWN wrappers. A Dart-side payload assertion cannot show
        // whether the native receiver honours a flag, which is how a discarded publisher pause
        // stayed green for a whole review cycle.
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.robolectric:robolectric:4.13'
        testImplementation 'io.mockk:mockk:1.13.12'
    }
}
